name: orange_wifi_control
description: >-
  Application mobile pour voir les appareils connectés à ton WiFi (routeur
  Orange Maroc / ZTE) et bloquer l'accès aux appareils non autorisés.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FF7900"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 24
